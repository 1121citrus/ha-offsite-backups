# Grype ignore rules — AL2023 packages with no fix published to the repo
# mirror yet, or confirmed version-string false positives. Every entry
# must be documented in SECURITY.md.
#
# 2026-11-15: after switching to `dnf upgrade --releasever=latest`, the
# 7 ALAS entries (curl, cyrus-sasl, libcap, pcre2, python3, python3.12,
# ca-certificates) are fixed in the installed RPMs and were removed.
#
# Add new entries only after confirming with
# `dnf --releasever=latest list --showduplicates <pkg>` that no fixed build
# exists. Give each entry a dated justification comment.

ignore:
  # 2026-11-15: python3-urllib3 1.25.10-5.amzn2023.0.9 (latest AL2023
  # build) is a runtime dependency of awscli-2. AL2023 backports fixes
  # without bumping the "1.25.10" version string that Grype matches.
  # CVE-2021-33503: AL2023 rates the package "Not Affected"
  # (alas.aws.amazon.com). Same entry as pg-volume-backup.
  - vulnerability: GHSA-q2q7-5pp4-w6pg
    package:
      name: urllib3
      type: python
