name: CI

on:
  push:
    branches: [dev, main, master, staging]
    tags: ["v*"]
  pull_request:
    branches: [dev, main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/ha-offsite-backups
      inject-metadata: true
      test-mode: bats
      test-bats-files: |
        test/00-noop.bats
        test/01-dockerfile.bats
        test/02-ha-offsite-backups.bats
        test/03-build.bats
        test/04-image-metadata.bats
        test/05-common-functions.bats
        test/06-healthcheck.bats
        test/07-ha-offsite-backups-coverage.bats
      smoke-enabled: true
      smoke-commands: |
        docker run --rm --entrypoint bash "${IMAGE}:${VERSION}" -c 'test -x /usr/local/bin/ha-offsite-backups'
        docker run --rm "${IMAGE}:${VERSION}" --help
      trivyignore: .trivyignore
    secrets: inherit
